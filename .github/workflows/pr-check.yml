name: 🔍 Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  # 🚀 Quick Build Check
  quick-check:
    name: 🚀 Quick Build Check
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🔧 Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libprotobuf-dev \
          protobuf-compiler \
          libgrpc++-dev \
          protobuf-compiler-grpc

    - name: 🏗️ Quick Build Test
      run: |
        ./build.sh clean release

    - name: 🧪 Smoke Test
      run: |
        timeout 5s ./build/bin/trading_server &
        sleep 2
        pkill trading_server || true
        echo "✅ Basic functionality verified"

  # 📝 Code Quality Check
  code-quality:
    name: 📝 Code Quality
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🔍 Check Code Format
      run: |
        # Check for common issues
        echo "=== Code Quality Checks ==="
        
        # Check for TODO/FIXME comments
        if grep -r "TODO\|FIXME" --include="*.cpp" --include="*.hpp" .; then
          echo "⚠️  Found TODO/FIXME comments"
        fi
        
        # Check for debug prints
        if grep -r "cout\|printf" --include="*.cpp" --include="*.hpp" .; then
          echo "⚠️  Found debug output statements"
        fi
        
        # Check file endings
        find . -name "*.cpp" -o -name "*.hpp" | xargs file | grep CRLF && {
          echo "❌ Found Windows line endings"
          exit 1
        } || echo "✅ Line endings OK"
        
        echo "✅ Code quality checks passed"

  # 📋 Documentation Check
  docs-check:
    name: 📋 Documentation Check
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📚 Verify Documentation
      run: |
        echo "=== Documentation Checks ==="
        
        # Check required files exist
        required_files=("README.md" "BUILD_SUMMARY.md" "CMakeLists.txt" "build.sh")
        for file in "${required_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done
        
        # Check README has minimum content
        if grep -q "Trading Engine" README.md && \
           grep -q "Building" README.md && \
           grep -q "Usage" README.md; then
          echo "✅ README.md has required sections"
        else
          echo "❌ README.md missing required sections"
          exit 1
        fi
        
        echo "✅ Documentation checks passed"
